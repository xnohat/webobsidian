services:
  webobsidian:
    build: .
    # WO_IMAGE lets deploy.sh control the tag it builds, tags for rollback and runs.
    image: ${WO_IMAGE:-webobsidian:latest}
    container_name: webobsidian
    restart: unless-stopped
    ports:
      # ${HTTP_PORT:-8787} on the host → 8787 in the container.
      # Set HTTP_BIND=127.0.0.1 in .env to expose only to localhost (reverse proxy).
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-8787}:8787"
    environment:
      # Set an initial password (otherwise set it on first-run in the UI)
      WEBOBSIDIAN_PASSWORD: ${WEBOBSIDIAN_PASSWORD:-}
      # File-watch mode: auto (native + polling fallback) | polling. See .env.example.
      WEBOBSIDIAN_WATCH: ${WEBOBSIDIAN_WATCH:-auto}
      WEBOBSIDIAN_RECONCILE_INTERVAL_MS: ${WEBOBSIDIAN_RECONCILE_INTERVAL_MS:-60000}
      WEBOBSIDIAN_HASH_AUDIT_INTERVAL_MS: ${WEBOBSIDIAN_HASH_AUDIT_INTERVAL_MS:-1800000}
      # Proxy trust. Default "true" (trust immediate hop) so X-Forwarded-Proto
      # HTTPS cookie detection works behind a reverse proxy. Not a rate-limit risk
      # (limiter keys on the TCP socket addr, not X-Forwarded-For). Set "false" only
      # for a directly-exposed instance with no proxy. See .env.example.
      TRUST_PROXY: ${TRUST_PROXY:-true}
      # Header with the real client IP from the proxy in front (e.g. CF-Connecting-IP
      # behind a Cloudflare tunnel) so the login limit is per visitor, not shared by
      # everyone arriving via the proxy. Empty = key on the socket address.
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
      VAULT_PATH: /vault
      DATA_DIR: /data
      ALLOWED_ROOTS: /vault
      WEBOBSIDIAN_MCP_ENABLED: ${WEBOBSIDIAN_MCP_ENABLED:-false}
      WEBOBSIDIAN_MCP_PUBLIC_URL: ${WEBOBSIDIAN_MCP_PUBLIC_URL:-}
      WEBOBSIDIAN_MCP_ALLOWED_ORIGINS: ${WEBOBSIDIAN_MCP_ALLOWED_ORIGINS:-}
      NODE_ENV: production
    volumes:
      # Your vault on the host (VAULT_HOST_PATH in .env) → /vault in the container.
      # Defaults to the bundled sample vault so `docker compose up` works immediately.
      - ${VAULT_HOST_PATH:-./sample-vault}:/vault
      # Persisted settings.json + search index
      - webobsidian-data:/data
    healthcheck:
      # IPv4 literal on purpose. Inside the container "localhost" resolves to ::1
      # (IPv6) while the server binds 0.0.0.0 (IPv4 only), and busybox wget does not
      # fall back to the next address — the probe then fails forever and the
      # container reports "unhealthy" while the API serves every request normally.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Allow time for the initial vault index on first boot (large vaults).
      start_period: 90s

volumes:
  webobsidian-data:
